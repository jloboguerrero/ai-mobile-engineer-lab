<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Hola Mundo - Five Languages</title>
</head>
<body>
    <h1 style="text-align: center; font-family: Arial, sans-serif;">
        Hello World! (¡Hola Mundo!)<br><br>

        <div style="display: flex; justify-content: center; gap: 40px; padding-top: 20px;">
            <span>Hola mundo</span> <!-- Español -->
            <span>Hello world</span> <!-- English/Español americano -->
            <span>Bonjour le monde</span> <!-- Francés/Francés canadiense -->
            <span>Ciao mondo</span> <!-- Italiano/Italiano italiano -->
        </div>
    </h1>

    <p style="text-align: center; color: #666;">Hello World in 5 languages! 🌍</p>
</body>
</html>
